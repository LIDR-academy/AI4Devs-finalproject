groups:
  - name: mecatrack.api
    rules:
      - alert: MecaTrackApiDown
        expr: up{job="mecatrack-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: MecaTrack API scrape is down
          description: Prometheus target mecatrack-api has been down for more than 2 minutes.

      - alert: MecaTrackHighHttp5xx
        expr: |
          (
            sum(rate(mecatrack_http_requests_total{status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(mecatrack_http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High HTTP 5xx ratio on MecaTrack API
          description: HTTP 5xx ratio has been greater than 5% for more than 5 minutes.

      - alert: MecaTrackHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(mecatrack_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High p95 latency on MecaTrack API
          description: HTTP p95 latency has been greater than 2 seconds for more than 10 minutes.
