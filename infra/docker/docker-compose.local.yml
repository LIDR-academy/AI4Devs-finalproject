version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: RealSaveFooding-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: RealSaveFooding
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
