version: "3.9"

# Runs both app containers on a single EC2 instance for the free-tier demo deployment.
# CloudFront (configured separately) is the HTTPS entrypoint in front of these two ports.
services:
  api:
    image: realsavefooding-api:latest
    build:
      context: ../../back
    container_name: RealSaveFooding-api
    restart: unless-stopped
    env_file:
      - back.env
    ports:
      - "3000:3000"
    # No awslogs-stream-prefix: the Docker Engine version installed on the EC2 instance
    # (get.docker.com always installs latest, currently 29.x) rejects that option with
    # "unknown log opt 'awslogs-stream-prefix' for awslogs log driver". Without it the
    # driver falls back to naming streams by container ID, which is fine for a single
    # long-lived container per service.
    logging:
      driver: awslogs
      options:
        awslogs-group: /realsavefooding/prod
        awslogs-region: eu-west-1

  frontend:
    image: realsavefooding-front:latest
    build:
      context: ../../front
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY}
    container_name: RealSaveFooding-frontend
    restart: unless-stopped
    ports:
      - "4173:4173"
    logging:
      driver: awslogs
      options:
        awslogs-group: /realsavefooding/prod
        awslogs-region: eu-west-1
