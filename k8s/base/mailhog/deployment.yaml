apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-mailhog
  labels:
    app: aura-mailhog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aura-mailhog
  template:
    metadata:
      labels:
        app: aura-mailhog
    spec:
      containers:
      - name: mailhog
        image: mailhog/mailhog:v1.0.1
        ports:
        - containerPort: 1025
          name: smtp
        - containerPort: 8025
          name: web
