apiVersion: batch/v1
kind: CronJob
metadata:
  name: reminders-worker
  namespace: aura
spec:
  schedule: "0 9 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: reminders-worker
        spec:
          imagePullSecrets:
          - name: ghcr-secret
          containers:
          - name: worker
            image: aura-workers-reminders:latest
            envFrom:
            - configMapRef:
                name: aura-app-configmap
            - secretRef:
                name: aura-app-secret
            - secretRef:
                name: api-secrets
          restartPolicy: OnFailure
