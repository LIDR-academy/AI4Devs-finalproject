apiVersion: batch/v1
kind: CronJob
metadata:
  name: reminders-worker
  namespace: aura
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: reminders-worker
        spec:
          imagePullSecrets:
          - name: ghcr-secret
          containers:
          - name: worker
            image: aura-workers-reminders:latest
            imagePullPolicy: IfNotPresent
            envFrom:
            - secretRef:
                name: api-secrets
          restartPolicy: OnFailure
