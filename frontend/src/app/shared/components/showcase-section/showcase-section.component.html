<section class="showcase-section">
  <header class="showcase-section__header">
    <div class="showcase-section__title-group">
      <h2 class="showcase-section__title">{{ section().title }}</h2>
      <div class="showcase-section__accent-line"></div>
    </div>
    <a class="showcase-section__more" href="#">Ver más →</a>
  </header>

  <div class="showcase-section__grid">
    @for (item of section().items; track item.artist.id) {
      <app-artist-card [item]="item" />
    }
  </div>
</section>
