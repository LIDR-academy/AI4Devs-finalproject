<main class="showcase-page">
  @if (loading()) {
    <div class="showcase-page__skeleton">
      @for (section of [1, 2, 3, 4]; track section) {
        <div class="skeleton-section">
          <div class="skeleton-title"></div>
          <div class="skeleton-grid">
            @for (card of [1, 2, 3, 4]; track card) {
              <div class="skeleton-card"></div>
            }
          </div>
        </div>
      }
    </div>
  } @else if (error()) {
    <div class="showcase-page__error">
      <p>{{ error() }}</p>
      <button (click)="fetchSections()">Reintentar</button>
    </div>
  } @else {
    @for (section of sections(); track section.key) {
      <app-showcase-section [section]="section" />
    }
  }
</main>
