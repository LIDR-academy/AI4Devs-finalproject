<mat-toolbar color="primary" class="app-toolbar">
  <span class="brand" routerLink="/">🖋️ INK·LINK</span>
  <span class="spacer"></span>
  @if (authService.isAuthenticated()) {
    <button mat-button routerLink="/mi-cuenta">Mi cuenta</button>
    <button mat-button (click)="authService.logout()">Cerrar sesión</button>
  } @else {
    <button mat-button routerLink="/login">Iniciar sesión</button>
  }
</mat-toolbar>

<main>
  <router-outlet />
</main>
