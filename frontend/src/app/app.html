<mat-toolbar class="app-toolbar">
  <a class="app-brand" routerLink="/">
    <span class="app-brand__mark">✒</span>
    <span class="app-brand__name">INK<span class="app-brand__dot">·</span>LINK</span>
  </a>
  <a class="nav-link" routerLink="/artistas">Artistas</a>
  <span class="spacer"></span>
  @if (authService.isAuthenticated()) {
    <button mat-button class="nav-link" routerLink="/mis-reservas">Mis reservas</button>
    <button mat-button class="nav-link" routerLink="/mi-cuenta">Mi cuenta</button>
    <button mat-stroked-button class="nav-btn--logout" (click)="authService.logout()">Salir</button>
  } @else {
    <button mat-flat-button class="nav-btn--cta" routerLink="/login">Iniciar sesión</button>
  }
</mat-toolbar>

<main class="app-main">
  <router-outlet />
</main>
