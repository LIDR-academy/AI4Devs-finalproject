name: Backend Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, feature/**]

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install coverage pytest pytest-cov faker factory-boy vcrpy

      - name: Run backend unit tests
        run: |
          python -m unittest discover -s tests/backend/unit -p 'test_*.py' -v

      - name: Coverage report (>=80%)
        run: |
          coverage run -m unittest discover -s tests/backend/unit -p 'test_*.py'
          coverage report
          coverage xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            coverage.xml
            htmlcov/
