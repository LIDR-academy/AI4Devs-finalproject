name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - local
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.0.0"

      - name: Set Environment Variable
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "ENV_NAME=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          else
            echo "ENV_NAME=production" >> $GITHUB_ENV
          fi

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save k8s-aura
      - name: Create GHCR Image Pull Secret
        run: |
          kubectl create namespace aura --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GH_PAT }} \
            --docker-email=github-actions@github.com \
            --namespace=aura \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Inject Production Secrets
        run: |
          echo "ConnectionStrings__DefaultConnection=${{ secrets.PROD_DB_CONNECTION }}" >> k8s/overlays/production/.env.production
          echo "Minio__AccessKey=${{ secrets.PROD_MINIO_ACCESS }}" >> k8s/overlays/production/.env.production
          echo "Minio__SecretKey=${{ secrets.PROD_MINIO_SECRET }}" >> k8s/overlays/production/.env.production
          echo "Smtp__Host=smtp.gmail.com" >> k8s/overlays/production/.env.production
          echo "Smtp__Port=587" >> k8s/overlays/production/.env.production
          echo "Smtp__Username=${{ secrets.PROD_SMTP_USER }}" >> k8s/overlays/production/.env.production
          echo "Smtp__Password=${{ secrets.PROD_SMTP_PASSWORD }}" >> k8s/overlays/production/.env.production
          
          # Parse Connection String for PostgreSQL initialization
          DB_CONN="${{ secrets.PROD_DB_CONNECTION }}"
          DB_PASS=$(echo "$DB_CONN" | grep -o 'Password=[^;]*' | cut -d= -f2)
          DB_USER=$(echo "$DB_CONN" | grep -o 'Username=[^;]*' | cut -d= -f2)
          DB_NAME=$(echo "$DB_CONN" | grep -o 'Database=[^;]*' | cut -d= -f2)
          
          echo "POSTGRES_PASSWORD=$DB_PASS" >> k8s/overlays/production/.env.postgres
          echo "POSTGRES_USER=$DB_USER" >> k8s/overlays/production/.env.postgres
          echo "POSTGRES_DB=$DB_NAME" >> k8s/overlays/production/.env.postgres

      - name: Deploy to Kubernetes
        run: |
          # Run Kustomize and apply
          kustomize build k8s/overlays/${{ env.ENV_NAME }} | kubectl apply -f -
          
          # Force deployments to pull the newly built 'latest' images
          kubectl rollout restart deployment -n aura

      - name: Output Application URL
        run: |
          echo "Fetching Load Balancer IP..."
          for i in {1..30}; do
            IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [ -n "$IP" ]; then
              break
            fi
            sleep 10
          done
          if [ -n "$IP" ]; then
            echo "🚀 Application is publicly accessible at: http://$IP"
          else
            echo "⚠️ Could not retrieve Load Balancer IP within 5 minutes. Check DigitalOcean dashboard."
          fi
