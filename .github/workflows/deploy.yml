name: TejaFlow CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Build And Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore backend
        run: dotnet restore backend/TejaFlow.slnx

      - name: Build backend
        run: dotnet build backend/TejaFlow.slnx --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test backend/TejaFlow.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/*.trx

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Build And Push Images
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    outputs:
      api-image: ${{ steps.image-names.outputs.api_image }}
      frontend-image: ${{ steps.image-names.outputs.frontend_image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize image names
        id: image-names
        run: |
          repository_lc="${GITHUB_REPOSITORY,,}"
          echo "api_image=${REGISTRY}/${repository_lc}/tejaflow-api" >> "${GITHUB_OUTPUT}"
          echo "frontend_image=${REGISTRY}/${repository_lc}/tejaflow-frontend" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata for API
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-names.outputs.api_image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata for frontend
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-names.outputs.frontend_image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy To Oracle VPS
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
          TEJAFLOW_CONNECTION_STRING: ${{ secrets.TEJAFLOW_CONNECTION_STRING }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          JWT_EXPIRATION_MINUTES: ${{ secrets.JWT_EXPIRATION_MINUTES }}
          CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
          TEJAFLOW_RUN_MIGRATIONS: ${{ secrets.TEJAFLOW_RUN_MIGRATIONS }}
        run: |
          set -euo pipefail
          missing=0
          for name in ORACLE_HOST ORACLE_USER ORACLE_SSH_PRIVATE_KEY MSSQL_SA_PASSWORD TEJAFLOW_CONNECTION_STRING JWT_ISSUER JWT_AUDIENCE JWT_SIGNING_KEY JWT_EXPIRATION_MINUTES CORS_ALLOWED_ORIGIN TEJAFLOW_RUN_MIGRATIONS; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing secret::${name} is required for deployment."
              missing=1
            fi
          done

          if [[ "${#JWT_SIGNING_KEY}" -lt 32 ]]; then
            echo "::error title=Invalid secret::JWT_SIGNING_KEY must contain at least 32 characters."
            missing=1
          fi

          exit "${missing}"

      - name: Upload production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          port: ${{ secrets.ORACLE_SSH_PORT || 22 }}
          source: deploy/docker/docker-compose.prod.yml
          target: /opt/tejaflow
          strip_components: 2

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          FRONTEND_IMAGE: ${{ needs.docker.outputs.frontend-image }}:latest
          API_IMAGE: ${{ needs.docker.outputs.api-image }}:latest
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
          TEJAFLOW_CONNECTION_STRING: ${{ secrets.TEJAFLOW_CONNECTION_STRING }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          JWT_EXPIRATION_MINUTES: ${{ secrets.JWT_EXPIRATION_MINUTES }}
          CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
          TEJAFLOW_RUN_MIGRATIONS: ${{ secrets.TEJAFLOW_RUN_MIGRATIONS }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          port: ${{ secrets.ORACLE_SSH_PORT || 22 }}
          envs: FRONTEND_IMAGE,API_IMAGE,MSSQL_SA_PASSWORD,TEJAFLOW_CONNECTION_STRING,JWT_ISSUER,JWT_AUDIENCE,JWT_SIGNING_KEY,JWT_EXPIRATION_MINUTES,CORS_ALLOWED_ORIGIN,TEJAFLOW_RUN_MIGRATIONS,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/tejaflow

            cat > .env.production <<EOF
            FRONTEND_IMAGE=${FRONTEND_IMAGE}
            API_IMAGE=${API_IMAGE}
            MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
            TEJAFLOW_CONNECTION_STRING=${TEJAFLOW_CONNECTION_STRING}
            JWT_ISSUER=${JWT_ISSUER}
            JWT_AUDIENCE=${JWT_AUDIENCE}
            JWT_SIGNING_KEY=${JWT_SIGNING_KEY}
            JWT_EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES}
            CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN}
            TEJAFLOW_RUN_MIGRATIONS=${TEJAFLOW_RUN_MIGRATIONS}
            EOF

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            docker compose --env-file .env.production -f docker-compose.prod.yml pull
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d

            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/api/health >/tmp/tejaflow-health.json; then
                cat /tmp/tejaflow-health.json
                docker compose --env-file .env.production -f docker-compose.prod.yml ps
                docker image prune -f
                exit 0
              fi

              echo "Waiting for TejaFlow health endpoint... attempt ${attempt}/30"
              sleep 5
            done

            docker compose --env-file .env.production -f docker-compose.prod.yml ps
            docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=120 api frontend sqlserver
            exit 1
