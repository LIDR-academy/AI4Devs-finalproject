name: CI

on:
  push:
    branches: [main, feature-entrega2-DMM]
  pull_request:
    branches: [main, feature-entrega2-DMM]

jobs:
  backend:
    name: Backend (lint + typecheck + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: realista
          POSTGRES_PASSWORD: realista
          POSTGRES_DB: realista_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U realista -d realista_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://realista:realista@localhost:5432/realista_test?schema=public
      NODE_ENV: test
      LOG_LEVEL: error
      MOCK_OPENROUTER: 'true'
      MOCK_NOMINATIM: 'true'
      MOCK_CATASTRO: 'true'
      OPENROUTER_API_KEY: test-key-not-used-due-to-mock
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - run: cd backend && npx prisma migrate deploy
      - run: cd backend && npm run lint
      - run: cd backend && npm run typecheck
      - run: cd backend && npm run test:all
      - run: cd backend && npm run test:coverage
      - run: bash .opencode/skills/hexagonal-check/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

  frontend:
    name: Frontend (lint + typecheck + test)
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://localhost:3001
      VITE_APP_NAME: Realista
      VITE_APP_VERSION: 0.2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run check
      - run: cd frontend && npm test

  e2e:
    name: E2E (Playwright with mocked APIs)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: realista
          POSTGRES_PASSWORD: realista
          POSTGRES_DB: realista_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U realista -d realista_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://realista:realista@localhost:5432/realista_test?schema=public
      NODE_ENV: test
      LOG_LEVEL: error
      MOCK_OPENROUTER: 'true'
      MOCK_NOMINATIM: 'true'
      MOCK_CATASTRO: 'true'
      OPENROUTER_API_KEY: test-key
      FRONTEND_URL: http://localhost:5173
      VITE_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: cd backend && npm ci && npx prisma migrate deploy
      - run: cd frontend && npm ci
      - run: cd e2e && npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
