name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate pipeline
        run: echo "CI pipeline is alive"

  validate-kustomize:
    name: Validate Kustomize Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.0.0"
      - name: Validate Local Overlay
        run: kustomize build k8s/overlays/local > /dev/null
      - name: Validate Production Overlay
        run: kustomize build k8s/overlays/production > /dev/null

  dotnet-build:
    name: Build & Test .NET Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          
      - name: Restore dependencies
        run: dotnet restore backend/AuraPlanning.sln
        
      - name: Build
        run: dotnet build backend/AuraPlanning.sln --no-restore
        
      - name: Test
        run: dotnet test backend/AuraPlanning.sln --no-build --verbosity normal

  angular-build:
    name: Build Angular Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend
        
      - name: Build
        run: npm run build -- --configuration production
        working-directory: ./frontend

  docker-build:
    name: Build & Push Docker Images
    needs: [dotnet-build, angular-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: backend/src/Aura.Api/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/aura-api
          - service: worker-email
            dockerfile: backend/workers/Aura.Workers.Email/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/aura-worker-email
          - service: worker-whatsapp
            dockerfile: backend/workers/Aura.Workers.WhatsApp/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/aura-worker-whatsapp
          - service: worker-ssg
            dockerfile: backend/workers/Aura.Workers.SSG/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/aura-worker-ssg
          - service: frontend
            dockerfile: frontend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/aura-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push
        run: |
          docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }}:${{ github.sha }} -t ${{ matrix.image }}:latest .
          docker push ${{ matrix.image }}:${{ github.sha }}
          docker push ${{ matrix.image }}:latest
