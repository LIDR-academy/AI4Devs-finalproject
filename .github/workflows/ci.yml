name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: realista
          POSTGRES_PASSWORD: realista
          POSTGRES_DB: realista_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U realista -d realista_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://realista:realista@localhost:5432/realista_test?schema=public
      NODE_ENV: test
      LOG_LEVEL: error
      MOCK_OPENROUTER: 'true'
      MOCK_NOMINATIM: 'true'
      MOCK_CATASTRO: 'true'
      OPENROUTER_API_KEY: test-key-not-used-due-to-mock
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - run: cd backend && npx prisma migrate deploy
      - run: cd backend && npm run lint
      - run: cd backend && npm run typecheck
      - run: cd backend && npm run test:all
      - run: cd backend && npm run test:coverage
      - run: bash .opencode/skills/hexagonal-check/run.sh
      - run: cd backend && npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://localhost:3001
      VITE_APP_NAME: Realista
      VITE_APP_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run check
      - run: cd frontend && npm test
      - run: cd frontend && npm run build

  e2e:
    name: E2E (real servers, mocked adapters)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: realista
          POSTGRES_PASSWORD: realista
          POSTGRES_DB: realista_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U realista -d realista_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://realista:realista@localhost:5432/realista_test?schema=public
      NODE_ENV: development
      LOG_LEVEL: error
      MOCK_OPENROUTER: 'true'
      MOCK_NOMINATIM: 'true'
      MOCK_CATASTRO: 'true'
      OPENROUTER_API_KEY: test-key
      FRONTEND_URL: http://localhost:5173
      VITE_API_URL: http://localhost:3001
      PLAYWRIGHT_ENABLED: 'false'
      PORT: 3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: cd backend && npx prisma migrate deploy
      - run: cd backend && npm run build
      - run: cd frontend && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start servers and run E2E
        run: |
          cd backend && npm run start &> /tmp/backend.log &
          BACKEND_PID=$!
          cd frontend && node build/index.js &> /tmp/frontend.log &
          FRONTEND_PID=$!

          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            curl -s http://localhost:3001/api/dashboard > /dev/null 2>&1 && break
            sleep 1
          done
          echo "Waiting for frontend..."
          for i in $(seq 1 30); do
            curl -s http://localhost:5173 > /dev/null 2>&1 && break
            sleep 1
          done

          echo "=== Backend logs ==="
          cat /tmp/backend.log
          echo "=== Frontend logs ==="
          cat /tmp/frontend.log

          npx playwright test --config e2e/playwright.config.ts
          EXIT_CODE=$?

          kill $BACKEND_PID $FRONTEND_PID 2>/dev/null || true
          exit $EXIT_CODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
