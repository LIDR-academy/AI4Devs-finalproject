# coturn dev TURN server for QuickChat (stream-media-v0).
# DEV ONLY — plain TURN over TCP (no TLS), static dev credentials. Not production.
#
# Why this exists: on Docker Desktop macOS, direct WebRTC media between a real
# browser and containerized LiveKit is unreliable (browsers hide host candidates
# behind mDNS the container can't resolve; UDP reflection is browser-flaky). A TURN
# server relays media over a single reliable TCP connection, bypassing the problem.
#
# Topology: the browser reaches this server's CONTROL port at localhost:3478 (the
# only host-published port). LiveKit (the media peer) reaches the RELAY ports on the
# internal compose network by coturn's container IP, so the relay range does NOT need
# host publishing. coturn's default relay-ip = its container interface IP, which
# LiveKit can reach — so no external-ip juggling is needed for this all-in-Docker dev.

listening-port=3478
fingerprint

# Static long-term credentials (DEV ONLY — advertised to browsers via LiveKit's
# rtc.turn_servers). Not secrets to protect; clearly dev.
lt-cred-mech
user=devuser:devpass
realm=quickchat

# Relay port range — internal only (reachable by LiveKit on the compose network).
min-port=50000
max-port=50100

# Dev: no TLS/DTLS (browsers accept plain turn:...?transport=tcp on localhost).
no-tls
no-dtls
no-cli

# Dev: log to stdout so `docker compose logs coturn` shows allocations/errors.
log-file=stdout
simple-log

# Allow relaying to the private Docker network (LiveKit) — dev only.
# coturn denies some ranges by default; permit the RFC1918 space the stack uses.
allowed-peer-ip=172.16.0.0-172.31.255.255
allowed-peer-ip=192.168.0.0-192.168.255.255
allowed-peer-ip=10.0.0.0-10.255.255.255
