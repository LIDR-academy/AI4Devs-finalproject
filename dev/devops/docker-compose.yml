# QuickChat local runtime.
# The APP plane is single-origin: only the `proxy` publishes app ports (browser
# reaches streamer /streams*, security /auth*, and the portal through it).
# The MEDIA plane is a SECOND origin: `livekit` (+ `coturn` TURN) publishes its own
# ports because WebRTC cannot traverse the nginx HTTP proxy (stream-media-v0, root D3).
# `docker compose up` brings up the full stack: valkey, livekit, coturn, mongo,
# users, security, streamer, portal, and the reverse proxy.
#
# devops owns this file, nginx.conf, livekit.yaml, coturn.conf. It CONSUMES each
# service's Dockerfile (build contexts below) without modifying them.

name: quickchat

services:
  # Ephemeral, anonymous key/value store — streamer's private storage.
  # No volume => nothing survives a restart (v0 has no persistence).
  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey:8.1-alpine}
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - quickchat
    restart: unless-stopped

  # LiveKit SFU (WebRTC media). SECOND published origin — the browser connects to
  # it directly (not through nginx). Dev mode (--dev provides the devkey/secret dev
  # pair); livekit.yaml pins ports, the single UDP mux port, and the streamer webhook.
  # DEV ONLY: no Redis, no TLS, no TURN. Host networking would avoid port mapping but
  # is Linux-only; published ports + single UDP mux is the cross-platform dev path.
  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.13.4}
    command: --config /etc/livekit/livekit.yaml --dev --bind 0.0.0.0
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "${LIVEKIT_WS_PORT:-7880}:7880"        # WS signaling (browser) + HTTP/Twirp API (streamer)
      - "${LIVEKIT_TCP_PORT:-7881}:7881"       # ICE/TCP fallback
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"   # single UDP mux for media (direct path)
      # NOTE (stream-media-v0): the direct UDP/TCP paths above are unreliable for
      # real browsers on Docker Desktop macOS (mDNS-hidden host candidates + flaky
      # UDP). The `coturn` dev TURN service (below) provides a reliable TCP relay
      # candidate that browsers fall back to. See coturn.conf + livekit.yaml
      # turn_servers. Direct paths are kept for host clients / Linux where they work.
    networks:
      - quickchat
    restart: unless-stopped

  # Dev TURN server (stream-media-v0, root D10). DEV ONLY — plain TURN over TCP,
  # static dev creds, no TLS. Relays real-browser media reliably on Docker Desktop
  # macOS, where the direct WebRTC path is unreliable (mDNS-hidden host candidates +
  # flaky UDP). Only the control port 3478 is published (browsers reach it at
  # localhost:3478); the relay range 50000-50100 stays internal — LiveKit reaches it
  # on the compose network. Production TURN/TLS/host-networking is a deferred feature.
  coturn:
    image: ${COTURN_IMAGE:-coturn/coturn:4.6.2}
    command: -c /etc/coturn/turnserver.conf
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "${TURN_PORT:-3478}:3478"        # TURN control (browser-facing, TCP)
      - "${TURN_PORT:-3478}:3478/udp"    # TURN control (UDP; harmless, TCP is used)
    networks:
      - quickchat
    restart: unless-stopped

  # MongoDB — persistence for the `users` service (security-v0). INTERNAL ONLY:
  # no published host port; never reachable from the host or portal (PRD §5.2).
  # DEV-ONLY root creds from env; EPHEMERAL (no volume) — dev users are wiped on
  # `docker compose down`. A named volume is a one-line change if persistence is wanted.
  mongo:
    image: ${MONGO_IMAGE:-mongo:7.0}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-quickchat}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-quickchatdev}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - quickchat
    restart: unless-stopped

  # User persistence service (Go + MongoDB). INTERNAL ONLY — never published;
  # reached only by `security` over the compose network. Env var names owned by users
  # and supplied here verbatim (pinned with users: MONGO_URI / MONGO_DB / USERS_HTTP_ADDR).
  users:
    build:
      context: ../users
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://quickchat:quickchatdev@mongo:27017/?authSource=admin}
      MONGO_DB: ${MONGO_DB:-quickchat}
      USERS_HTTP_ADDR: ${USERS_HTTP_ADDR:-:8080}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - quickchat
    restart: unless-stopped

  # Auth service (Go + SuperTokens Go SDK) — fronts SuperTokens managed cloud.
  # Internal; reached by the browser only through the proxy at /auth/*, and by
  # streamer internally for JWKS. The SuperTokens creds are HUMAN-SUPPLIED via the
  # git-ignored .env and are NEVER committed. They render empty if unset, and the
  # `security` service fails fast at startup with a clear log if they are empty
  # (keeping routine compose commands — ps/down/config — usable without creds). NO
  # SuperTokens core / mail container — the managed cloud hosts core + storage + email.
  security:
    build:
      context: ../security
    environment:
      # REQUIRED, human-supplied in dev/devops/.env (git-ignored). Never commit.
      SUPERTOKENS_CONNECTION_URI: ${SUPERTOKENS_CONNECTION_URI:-}
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY:-}
      # App/API + website domains (names confirmed with security). Both are the
      # single origin http://localhost:8080 here — the portal is served THROUGH the
      # proxy at 8080, NOT a standalone Vite dev server on 5173.
      SECURITY_API_DOMAIN: ${SECURITY_API_DOMAIN:-http://localhost:8080}
      SECURITY_WEBSITE_DOMAIN: ${SECURITY_WEBSITE_DOMAIN:-http://localhost:8080}
      SECURITY_API_BASE_PATH: ${SECURITY_API_BASE_PATH:-/auth}
      # security → users internal get-or-create endpoint (users listens on :8080).
      USERS_GET_OR_CREATE_URL: ${USERS_GET_OR_CREATE_URL:-http://users:8080/internal/users/get-or-create}
      # security reads PORT (default 8080) for its listen addr.
      PORT: ${SECURITY_PORT:-8080}
    depends_on:
      users:
        condition: service_started
    networks:
      - quickchat
    restart: unless-stopped

  # Go HTTP API. Internal only; reached by the browser only through the proxy.
  # Env var names are owned by streamer and supplied here verbatim.
  streamer:
    build:
      context: ../streamer
    environment:
      VALKEY_ADDR: ${VALKEY_ADDR:-valkey:6379}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      VALKEY_DB: ${VALKEY_DB:-0}
      STREAMER_ADDR: ${STREAMER_ADDR:-:8080}
      # Chat knobs (room-chat-v0) — read verbatim by streamer, overridable via .env.
      CHAT_MAX_MESSAGES: ${CHAT_MAX_MESSAGES:-1000000}
      CHAT_PAGE_SIZE: ${CHAT_PAGE_SIZE:-200}
      CHAT_MAX_LENGTH: ${CHAT_MAX_LENGTH:-500}
      # LiveKit config (stream-media-v0). DEV-ONLY key/secret (well-known dev pair;
      # same pair LiveKit uses in --dev). LIVEKIT_URL is the internal HTTP/Twirp
      # server API; LIVEKIT_PUBLIC_URL is browser-facing and returned in tokens.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LIVEKIT_URL: ${LIVEKIT_URL:-http://livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      # security-v0: streamer verifies Bearer JWTs locally against security's JWKS,
      # fetched at startup + refreshed WITH RETRY (so it tolerates security starting
      # later — no health gate below, avoiding a deadlock). Path pending security's confirm.
      SECURITY_JWKS_URL: ${SECURITY_JWKS_URL:-http://security:8080/auth/jwt/jwks.json}
    depends_on:
      valkey:
        condition: service_healthy
      livekit:
        condition: service_started
    # In-image health subcommand (streamer's minimal image has no shell/curl).
    # It GETs /readyz, which is 200 only once Valkey is reachable — so
    # "streamer healthy" means "streamer is actually wired to Valkey".
    healthcheck:
      test: ["CMD", "/streamer", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - quickchat
    restart: unless-stopped

  # Static portal (Bun.serve). Serves assets and owns SPA fallback internally.
  # Internal only; reached by the browser only through the proxy.
  portal:
    build:
      context: ../qc-portal
    environment:
      PORT: ${PORTAL_PORT:-3000}
    # The portal image has no curl/wget, but ships bun and a GET /healthz -> 200.
    # Probe it with bun's fetch so the proxy waits for the portal to actually serve.
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:'+(process.env.PORT||'3000')+'/healthz');process.exit(r.ok?0:1)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - quickchat
    restart: unless-stopped

  # The single browser-facing origin. Routes /streams* -> streamer (verbatim),
  # everything else -> portal (which handles SPA fallback).
  proxy:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      streamer:
        condition: service_healthy
      portal:
        condition: service_healthy
      security:
        condition: service_started   # /auth upstream exists when the origin comes up
    networks:
      - quickchat
    restart: unless-stopped

networks:
  quickchat:
    driver: bridge
