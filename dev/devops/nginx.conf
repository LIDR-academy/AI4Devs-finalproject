# Reverse proxy — the single browser-facing origin for QuickChat (home-stream-lifecycle-v0).
# Routing (frozen root decision D2):
#   /streams        (the collection: GET list, POST create) -> streamer
#   /streams/{id}   (a single stream: DELETE)               -> streamer
#   everything else                                          -> portal (owns SPA fallback)
#
# No path rewrite: streamer receives the literal §6 wire-contract paths.
# No CORS: the browser loads the app and calls /streams from this same origin.

upstream streamer {
    server streamer:8080;
}

upstream portal {
    server portal:3000;
}

server {
    listen 80;
    server_name _;

    # Exact match for the collection endpoint (GET /streams, POST /streams).
    # `=` is chosen over a bare prefix so paths like /streams-anything can never
    # be misrouted to the API; only the exact /streams matches here.
    location = /streams {
        proxy_pass http://streamer;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prefix match for a single stream: /streams/{id} (DELETE). Note this is
    # distinct from the portal route /stream/{id} (singular, no trailing 's').
    location /streams/ {
        proxy_pass http://streamer;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the portal. The portal's own static server serves real
    # assets and falls back to index.html for client routes (/, /stream/{id}),
    # so the proxy needs no try_files logic of its own.
    location / {
        proxy_pass http://portal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
