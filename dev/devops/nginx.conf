# Reverse proxy — the single browser-facing origin for QuickChat.
# Routing (frozen root decisions D2 / room-chat D4):
#   /streams              (collection: GET list, POST create)      -> streamer (HTTP)
#   /streams/{id}/ws      (room chat WebSocket)                     -> streamer (WS upgrade)
#   /streams/{id}...      (single stream: DELETE, messages history) -> streamer (HTTP)
#   everything else                                                 -> portal (owns SPA fallback)
#
# No path rewrite: streamer receives the literal §6 wire-contract paths.
# No CORS: the browser loads the app and talks to streamer only via this origin.

# WebSocket upgrade plumbing (room-chat-v0): map the request's Upgrade header to
# the matching Connection header. Non-WS requests have an empty Upgrade header, so
# they get "Connection: close" and are proxied as ordinary HTTP — unaffected.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream streamer {
    server streamer:8080;
}

upstream portal {
    server portal:3000;
}

server {
    listen 80;
    server_name _;

    # Room chat WebSocket (room-chat-v0): /streams/{id}/ws.
    # A regex location so it takes precedence over the /streams/ prefix below and
    # gets the WS-upgrade treatment. HTTP /streams endpoints stay plain HTTP.
    location ~ ^/streams/[^/]+/ws$ {
        proxy_pass http://streamer;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat rooms can be quiet for long stretches; don't drop a live socket.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Exact match for the collection endpoint (GET /streams, POST /streams).
    # `=` is chosen over a bare prefix so paths like /streams-anything can never
    # be misrouted to the API; only the exact /streams matches here.
    location = /streams {
        proxy_pass http://streamer;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prefix match for a single stream: /streams/{id} (DELETE) and
    # /streams/{id}/messages (history GET). Note this is distinct from the portal
    # route /stream/{id} (singular, no trailing 's'). The WS path above is a regex
    # location and is matched first, so it does not fall through to here.
    location /streams/ {
        proxy_pass http://streamer;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the portal. The portal's own static server serves real
    # assets and falls back to index.html for client routes (/, /stream/{id}),
    # so the proxy needs no try_files logic of its own.
    location / {
        proxy_pass http://portal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
