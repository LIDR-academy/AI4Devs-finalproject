server {
    listen 8080;
    server_name localhost;

    # ── Cabeceras de seguridad del SPA (TK-141, ADR-005 fuerza 3) ──────────────
    # El SPA se servía sin ninguna cabecera: si entrara un XSS, nada acotaba el
    # daño (el token de sesión vive hoy en localStorage — ver ADR-005/TK-140).
    # Definidas como variable + `always` para poder reinyectarlas en cada location
    # que las necesite: en nginx, un `add_header` dentro de un location REEMPLAZA
    # los del server, no los hereda.
    #
    # Calibrada contra el build real (`dist/index.html` + bundle), no por defecto:
    #   script-src 'self'          -> el bundle de Vite es un módulo del mismo origen;
    #                                 index.html no tiene ningún <script> inline.
    #   style-src  'unsafe-inline' -> exigido por la excepción (a) del Guard 29:
    #                                 `style={{ '--bar-pct': ... }}` en
    #                                 ReportsDashboard.tsx:180 y
    #                                 FEFOInventoryHealthBar.tsx:36. El riesgo real
    #                                 vive en script-src, que sí queda cerrado.
    #   fonts.googleapis/gstatic   -> Big Shoulders Display + IBM Plex (TK-081-FE).
    #   blob:                      -> @zxing/browser usa createObjectURL para el
    #                                 stream del escáner de códigos (US-032).
    #   connect-src 'self'         -> la API va por /api/ en ESTE mismo origen.
    set $spa_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'";

    # Activos con hash de contenido de Vite: si el fichero no existe es una
    # referencia obsoleta — devolver 404 real, NUNCA el index.html (evita el
    # clásico "Unexpected token '<'" al parsear HTML como JS).
    location /assets/ {
        root      /usr/share/nginx/html;
        try_files $uri =404;

        add_header Content-Security-Policy   $spa_csp always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header Referrer-Policy            "no-referrer" always;
        add_header X-Frame-Options            "DENY" always;
        add_header Permissions-Policy         "camera=(self), microphone=(), geolocation=(), payment=()" always;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;

        add_header Content-Security-Policy   $spa_csp always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header Referrer-Policy            "no-referrer" always;
        add_header X-Frame-Options            "DENY" always;
        # `camera=(self)` NO es opcional: US-032 escanea códigos de barras con
        # getUserMedia vía @zxing/browser. Un `camera=()` por defecto habría roto
        # esa funcionalidad en producción sin ningún test que lo detectara.
        add_header Permissions-Policy         "camera=(self), microphone=(), geolocation=(), payment=()" always;
        # Fallback SPA (US-023): las rutas de cliente (`/estaciones`, `/reportes`, …)
        # son paths reales de react-router. Sin esto, abrir o recargar cualquier ruta
        # distinta de `/` daría 404 de nginx en el build de producción.
        try_files $uri $uri/ /index.html;
    }

    # Reenvía las llamadas del cliente al backend por su alias de red interno
    # ("backend" en docker-compose.yml y en infrastructure/opentofu/main.tf) —
    # sin esto, fetch('/api/v1/...') desde el navegador resolvía contra este mismo
    # nginx (que solo sirve estáticos) en vez de contra el backend real.
    # Deliberadamente SIN cabeceras de seguridad propias (TK-141): el backend ya
    # emite las suyas con helmet, incluida una CSP relajada específica para Swagger
    # UI (`app.ts:167`). Añadir aquí una segunda CSP haría que el navegador aplicara
    # la intersección de ambas y rompería Swagger. En nginx las cabeceras del server
    # no se heredan cuando el location define las suyas, así que basta con no
    # declararlas en este bloque.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
