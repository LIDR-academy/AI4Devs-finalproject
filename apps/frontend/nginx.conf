server {
    listen 8080;
    server_name localhost;

    # Activos con hash de contenido de Vite: si el fichero no existe es una
    # referencia obsoleta — devolver 404 real, NUNCA el index.html (evita el
    # clásico "Unexpected token '<'" al parsear HTML como JS).
    location /assets/ {
        root      /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Fallback SPA (US-023): las rutas de cliente (`/estaciones`, `/reportes`, …)
        # son paths reales de react-router. Sin esto, abrir o recargar cualquier ruta
        # distinta de `/` daría 404 de nginx en el build de producción.
        try_files $uri $uri/ /index.html;
    }

    # Reenvía las llamadas del cliente al backend por su alias de red interno
    # ("backend" en docker-compose.yml y en infrastructure/opentofu/main.tf) —
    # sin esto, fetch('/api/v1/...') desde el navegador resolvía contra este mismo
    # nginx (que solo sirve estáticos) en vez de contra el backend real.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
