server {
    listen 8080;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    # Reenvía las llamadas del cliente al backend por su alias de red interno
    # ("backend" en docker-compose.yml y en infrastructure/opentofu/main.tf) —
    # sin esto, fetch('/api/v1/...') desde el navegador resolvía contra este mismo
    # nginx (que solo sirve estáticos) en vez de contra el backend real.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
