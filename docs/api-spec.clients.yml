openapi: 3.0.0
info:
  title: MecaTrack API — Client Management
  description: Client search and registration endpoints for MecaTrack (US-003)
  version: 1.0.0

servers:
  - url: http://localhost:4000/api
    description: Local development

paths:
  /clients/search:
    get:
      summary: Search clients
      description: |
        Search by name, national ID fragment, or phone digits (`q`), or exact national ID (`nationalId`).
        At least one query parameter is required. Short `q` values (< 2 chars) return an empty list.
      tags: [Clients]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
            minLength: 2
          description: Search term (name, national ID fragment, or phone digits)
        - in: query
          name: nationalId
          schema:
            type: string
          description: Exact national ID lookup
      responses:
        '200':
          description: Search results (max 20 items)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSearchResponse'
        '400':
          description: Missing search parameters
        '401':
          description: Unauthorized

  /clients/{id}:
    get:
      summary: Get client by ID
      tags: [Clients]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Client found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '401':
          description: Unauthorized
        '404':
          description: Client not found

    patch:
      summary: Update client contact data
      description: |
        Updates fullName, phone, and email. nationalId is immutable.
      tags: [Clients]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
      responses:
        '200':
          description: Client updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Client not found

  /clients:
    post:
      summary: Create a new client
      tags: [Clients]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        '201':
          description: Client created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '409':
          description: Duplicate national ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConflictResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ClientResponse:
      type: object
      required: [id, fullName, nationalId, phone, email, createdAt]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        nationalId:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ClientSearchResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientResponse'
        total:
          type: integer

    CreateClientRequest:
      type: object
      required: [fullName, nationalId]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        nationalId:
          type: string
          minLength: 5
          maxLength: 20
          pattern: '^[a-zA-Z0-9-]+$'
        phone:
          type: string
          pattern: '^[0-9]{8,15}$'
        email:
          type: string
          format: email

    UpdateClientRequest:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        phone:
          type: string
          pattern: '^[0-9]{8,15}$'
        email:
          type: string
          format: email

    ClientConflictResponse:
      type: object
      required: [statusCode, message, error, existingClient]
      properties:
        statusCode:
          type: integer
          example: 409
        message:
          type: string
          example: Client with this national ID already exists
        error:
          type: string
          example: Conflict
        existingClient:
          $ref: '#/components/schemas/ClientResponse'
