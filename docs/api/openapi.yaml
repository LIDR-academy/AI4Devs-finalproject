openapi: 3.0.3
info:
  title: RealSaveFooding API
  version: 0.1.0
paths:
  /api/auth/register:
    post:
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentialsRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
        '409':
          description: Email already in use

  /api/auth/login:
    post:
      summary: Authenticate a user and return a JWT session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentialsRequest'
      responses:
        '201':
          description: User authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
        '401':
          description: Invalid credentials

  /api/auth/me:
    get:
      summary: Retrieve current authenticated user session
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current session user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        '401':
          description: Missing or invalid token

  /api/settings/notifications:
    get:
      summary: Retrieve notification preference settings for authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          description: Missing or invalid token
    patch:
      summary: Update notification preference settings for authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
      responses:
        '200':
          description: Notification preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400':
          description: Validation error
        '401':
          description: Missing or invalid token

  /api/notifications/evaluate-expiring:
    post:
      summary: Trigger expiring-threshold evaluation job for current state
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Evaluation metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationEvaluationMetrics'
        '401':
          description: Missing or invalid token

  /api/notifications/events:
    get:
      summary: List emitted notification events for authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notification event list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationEventList'
        '401':
          description: Missing or invalid token

  /api/insights/waste:
    get:
      summary: Retrieve waste metrics (quantity, value, event count) for authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Waste metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WasteMetricsResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: No access to insights

  /api/dashboard/summary:
    get:
      summary: Retrieve dashboard summary counters for authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard summary counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          description: Missing or invalid token

  /api/dashboard/use-next:
    get:
      summary: Retrieve prioritized active pantry items to use next
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Prioritized pantry items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardUseNextResponse'
        '401':
          description: Missing or invalid token

  /api/pantry/items:
    post:
      summary: Create a manual pantry item for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePantryItemRequest'
      responses:
        '201':
          description: Pantry item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryItem'
        '400':
          description: Validation error
        '401':
          description: Missing or invalid token
        '403':
          description: No pantry access for current user

  /api/pantry/items/{id}/estimate-expiration:
    post:
      summary: Generate expiration estimate and confidence for a pantry item
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Expiration estimate generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpirationEstimate'
        '401':
          description: Missing or invalid token
        '403':
          description: No access to pantry item
        '404':
          description: Pantry item not found

  /api/pantry/items/{id}/expiration:
    patch:
      summary: Override pantry item expiration date with manual confirmation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideExpirationRequest'
      responses:
        '200':
          description: Expiration date overridden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverrideExpirationResponse'
        '400':
          description: Validation error
        '401':
          description: Missing or invalid token
        '403':
          description: No access to pantry item
        '404':
          description: Pantry item not found

  /api/pantry/items/{id}/events:
    post:
      summary: Register a consume or waste event for a pantry item
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterConsumptionEventRequest'
      responses:
        '201':
          description: Consumption event registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterConsumptionEventResponse'
        '400':
          description: Validation error
        '401':
          description: Missing or invalid token
        '404':
          description: Pantry item not found

  /api/receipts/upload:
    post:
      summary: Upload and process a receipt with OCR
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Receipt uploaded and processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          description: Invalid file type or size
        '401':
          description: Missing or invalid token
        '502':
          description: OCR provider failure
        '503':
          description: OCR provider timeout or temporary unavailability

  /api/receipts/{id}:
    get:
      summary: Retrieve receipt details and extracted line items
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Receipt details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '401':
          description: Missing or invalid token
        '404':
          description: Receipt not found

  /api/receipts/{id}/status:
    get:
      summary: Poll OCR processing status for a receipt
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Receipt OCR status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptStatus'
        '401':
          description: Missing or invalid token
        '404':
          description: Receipt not found

  /api/receipts/{id}/confirm-items:
    post:
      summary: Confirm extracted receipt items and optionally add them to pantry
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmReceiptItemsRequest'
      responses:
        '201':
          description: Confirmed receipt details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          description: Validation error or receipt not ready for confirmation
        '401':
          description: Missing or invalid token
        '404':
          description: Receipt not found

    get:
      summary: List pantry items for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pantry item list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PantryItem'
        '401':
          description: Missing or invalid token
        '403':
          description: No pantry access for current user

  /api/pantry/items/estimate-by-name:
    get:
      summary: Estimate expiration for a raw item name without an existing pantry item
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Estimated expiration metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpirationEstimate'

  /api/pantry/items/events:
    get:
      summary: List consumption/waste events for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [CONSUMED, WASTED]
      responses:
        '200':
          description: Event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsumptionEvent'
        '401':
          description: Missing or invalid token

  /api/pantry/items/expired-candidates:
    get:
      summary: List active pantry items eligible for auto-expiry (long past expiration)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Expired-candidate pantry items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PantryItem'
        '401':
          description: Missing or invalid token

  /api/pantry/items/bulk-waste:
    post:
      summary: Mark multiple pantry items as wasted in one call
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkItemIdsRequest'
      responses:
        '201':
          description: Items marked as wasted
        '400':
          description: Validation error
        '401':
          description: Missing or invalid token

  /api/pantry/items/bulk-dismiss-expired:
    post:
      summary: Dismiss multiple expired-candidate items without recording a waste event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkItemIdsRequest'
      responses:
        '201':
          description: Items dismissed
        '400':
          description: Validation error
        '401':
          description: Missing or invalid token

  /api/pantry/items/events/{eventId}/re-add:
    post:
      summary: Undo a consumption/waste event and restore the pantry item
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Pantry item re-added
        '401':
          description: Missing or invalid token
        '404':
          description: Event not found

  /api/expiration/preferences:
    get:
      summary: List learned per-category expiry offsets for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Expiry preference list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiryPreferencesResponse'
        '401':
          description: Missing or invalid token
    delete:
      summary: Delete all learned expiry preferences for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Preferences deleted
        '401':
          description: Missing or invalid token

  /api/expiration/preferences/{category}:
    delete:
      summary: Delete the learned expiry preference for a single category
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Preference deleted
        '401':
          description: Missing or invalid token

  /api/settings/auto-expiry:
    get:
      summary: Retrieve auto-expiry automation settings for authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Auto-expiry settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoExpirySettings'
        '401':
          description: Missing or invalid token
    patch:
      summary: Update auto-expiry automation settings for authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAutoExpirySettingsRequest'
      responses:
        '200':
          description: Auto-expiry settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoExpirySettings'
        '400':
          description: Validation error
        '401':
          description: Missing or invalid token

  /api/notifications/events/clear:
    post:
      summary: Clear in-memory notification events and reset alert marks for authenticated user
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Events cleared
        '401':
          description: Missing or invalid token

  /api/notifications/push-subscription:
    post:
      summary: Register a Web Push subscription for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePushSubscriptionRequest'
      responses:
        '201':
          description: Push subscription registered
        '400':
          description: Validation error
        '401':
          description: Missing or invalid token
    delete:
      summary: Remove the Web Push subscription for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Push subscription removed
        '401':
          description: Missing or invalid token

  /api/gamification/summary:
    get:
      summary: Retrieve gamification summary (points, badges, streak) for authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Gamification summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamificationSummary'
        '401':
          description: Missing or invalid token

  /api/gamification/history:
    get:
      summary: Retrieve paginated points/badge history for authenticated user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Points history page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsHistoryPage'
        '401':
          description: Missing or invalid token

  /api/recipes:
    get:
      summary: Retrieve recipe suggestions matched against current pantry contents
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Recipe suggestions
          content:
            application/json:
              schema:
                type: object
                required:
                  - recipes
                properties:
                  recipes:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecipeSuggestion'
        '401':
          description: Missing or invalid token

  /api/recipes/{mealId}:
    get:
      summary: Retrieve recipe detail (ingredients, instructions) matched against pantry
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: mealId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recipe detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
        '401':
          description: Missing or invalid token
        '404':
          description: Recipe not found
        '503':
          description: Recipe provider unavailable

  /api/recipes/{mealId}/cook:
    post:
      summary: Consume the pantry items used by a recipe and register consumption events
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: mealId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookRecipeRequest'
      responses:
        '201':
          description: Recipe cooked and pantry items consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookRecipeResponse'
        '400':
          description: Validation error
        '401':
          description: Missing or invalid token

  /api/households:
    post:
      summary: Create a household owned by the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHouseholdRequest'
      responses:
        '201':
          description: Household created
        '400':
          description: Validation error
        '401':
          description: Missing or invalid token

  /api/households/mine:
    get:
      summary: Retrieve the household the authenticated user belongs to, if any
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Household or null
        '401':
          description: Missing or invalid token

  /api/households/{id}/members:
    get:
      summary: List members of a household
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Household member list
        '401':
          description: Missing or invalid token
        '403':
          description: Not a member of this household

  /api/households/{id}/invitations:
    post:
      summary: Invite a user by email to join a household
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created
        '400':
          description: Validation error
        '401':
          description: Missing or invalid token
        '403':
          description: Not the household owner
    get:
      summary: List invitations for a household
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invitation list
        '401':
          description: Missing or invalid token
        '403':
          description: Not a member of this household

  /api/households/{id}/transfer-ownership:
    post:
      summary: Transfer household ownership to another member
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '200':
          description: Ownership transferred
        '400':
          description: Validation error
        '401':
          description: Missing or invalid token
        '403':
          description: Not the household owner

  /api/invitations/pending:
    get:
      summary: List pending household invitations for the authenticated user's email
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending invitation list
        '401':
          description: Missing or invalid token

  /api/invitations/{id}/accept:
    post:
      summary: Accept a pending household invitation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Invitation accepted, membership created
        '401':
          description: Missing or invalid token
        '404':
          description: Invitation not found

  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: API is healthy

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthCredentialsRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          example: password123

    SessionUser:
      type: object
      required:
        - id
        - email
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      required:
        - accessToken
        - user
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/SessionUser'

    CreatePantryItemRequest:
      type: object
      required:
        - name
        - quantity
        - unit
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Greek Yogurt
        quantity:
          type: integer
          minimum: 1
          example: 2
        unit:
          type: string
          enum: [unit, g, kg, ml, l, pack]
          example: unit
        expirationDate:
          type: string
          format: date-time
          nullable: true
          example: 2026-12-30T00:00:00.000Z

    PantryItem:
      type: object
      required:
        - id
        - userId
        - name
        - quantity
        - unit
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: integer
        unit:
          type: string
        expirationDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReceiptItem:
      type: object
      required:
        - id
        - rawName
        - userConfirmed
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        rawName:
          type: string
        quantity:
          type: integer
          nullable: true
        unit:
          type: string
          nullable: true
        userConfirmed:
          type: boolean
        pantryItemId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time

    Receipt:
      type: object
      required:
        - id
        - userId
        - originalFilename
        - mimeType
        - sizeBytes
        - storageBucket
        - storageKey
        - ocrStatus
        - createdAt
        - updatedAt
        - items
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        originalFilename:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        storageBucket:
          type: string
        storageKey:
          type: string
        ocrStatus:
          type: string
          enum: [PROCESSING, COMPLETED, FAILED]
        ocrError:
          type: string
          nullable: true
        processedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
