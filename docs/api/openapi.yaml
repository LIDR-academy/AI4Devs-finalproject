    Problem:
      type: object
      description: >
        Problem Details (RFC 9457). La propiedad `correlationId` es opcional y refleja el valor de
        `X-Correlation-Id` de la petición cuando el servicio lo propaga.
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        correlationId:
          type: string
          description: Identificador de correlación para soporte y trazabilidad en logs.
      required:
        - title
        - status

  responses:
    ProblemBadRequest:
      description: Solicitud incorrecta
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProblemUnauthorized:
      description: No autenticado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProblemForbidden:
      description: Prohibido
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProblemConflict:
      description: >
        Conflicto de reglas de negocio (p. ej. correo ya suscrito, especie referenciada por fichas de árbol).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProblemNotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProblemBadGateway:
      description: Error al contactar con un servicio aguas arriba
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
