openapi: 3.0.0
info:
  title: MecaTrack API — Work Orders
  description: Work order creation and lookup endpoints for MecaTrack (US-005)
  version: 1.0.0

servers:
  - url: http://localhost:4000/api
    description: Local development

paths:
  /work-orders/mechanics:
    get:
      summary: List active mechanics
      description: Returns active users with role MECHANIC for assignment selector.
      tags: [Work Orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active mechanics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MechanicSummary'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /work-orders/active:
    get:
      summary: Get active work order for vehicle
      description: |
        Returns the active work order for a vehicle, if any.
        Active statuses: EN_PROCESO, LISTA_PARA_ENTREGA.
      tags: [Work Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: vehicleId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active work order summary or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkOrderResponse'
        '400':
          description: Missing or invalid vehicleId
        '401':
          description: Unauthorized
        '404':
          description: Vehicle not found

  /work-orders:
    post:
      summary: Create work order
      description: |
        Creates a work order with initial tasks in a single transaction.
        Snapshots the current vehicle owner. Only one active work order per vehicle is allowed.
      tags: [Work Orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkOrderRequest'
      responses:
        '201':
          description: Work order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderDetail'
        '400':
          description: Validation error or invalid mechanic / no owner
        '401':
          description: Unauthorized
        '404':
          description: Vehicle not found
        '409':
          description: Vehicle already has an active work order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkOrderConflict'

  /work-orders/{id}:
    get:
      summary: Get work order by ID
      tags: [Work Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Work order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderDetail'
        '401':
          description: Unauthorized
        '404':
          description: Work order not found

  /work-orders/{workOrderId}/tasks:
    post:
      summary: Add task to work order
      description: Allowed only when work order status is EN_PROCESO.
      tags: [Work Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: workOrderId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderTask'
        '403':
          description: Work order is not editable
        '404':
          description: Work order not found

  /work-orders/{workOrderId}/tasks/{taskId}:
    patch:
      summary: Update task status
      description: |
        Transition task status. Completing requires cost ≥ 0.
        When all tasks are completed, work order transitions to LISTA_PARA_ENTREGA.
      tags: [Work Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: workOrderId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTaskResponse'
        '400':
          description: Validation or invalid transition
        '403':
          description: Work order is not editable
        '404':
          description: Work order or task not found
        '409':
          description: Task already completed

  /work-orders/{workOrderId}/tasks/{taskId}/technical-notes:
    patch:
      summary: Update task technical notes
      description: |
        Updates diagnosis, repair, parts, and additional notes for a task.
        Allowed only when work order is EN_PROCESO and task is not COMPLETED.
        Partial updates supported: omitted fields unchanged, null or empty clears.
      tags: [Work Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: workOrderId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskTechnicalNotesRequest'
      responses:
        '200':
          description: Task technical notes updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTechnicalNotesResponse'
        '400':
          description: Validation error (max 5000 chars per field)
        '403':
          description: Work order not editable or task completed
        '404':
          description: Work order or task not found

  /work-orders/{workOrderId}/visit-notes:
    patch:
      summary: Update visit-level technical notes
      description: |
        Updates visit-level diagnosis, repair summary, parts, and notes on the work order.
        Allowed only when work order status is EN_PROCESO.
      tags: [Work Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: workOrderId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVisitNotesRequest'
      responses:
        '200':
          description: Visit notes updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitNotesResponse'
        '400':
          description: Validation error (max 5000 chars per field)
        '403':
          description: Work order is not editable
        '404':
          description: Work order not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MechanicSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
      required:
        - id
        - fullName

    ActiveWorkOrderResponse:
      type: object
      properties:
        activeWorkOrder:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ActiveWorkOrderSummary'
      required:
        - activeWorkOrder

    ActiveWorkOrderSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [EN_PROCESO, LISTA_PARA_ENTREGA, OWNER_CONTACTED, ENTREGADA]
        checkedInAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - checkedInAt

    CreateWorkOrderRequest:
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
        entryReason:
          type: string
          minLength: 5
          maxLength: 500
        mileage:
          type: integer
          minimum: 0
        assignedMechanicId:
          type: string
          format: uuid
        initialTasks:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InitialTask'
      required:
        - vehicleId
        - entryReason
        - mileage
        - initialTasks

    InitialTask:
      type: object
      properties:
        description:
          type: string
          minLength: 3
          maxLength: 300
      required:
        - description

    CreateTaskRequest:
      type: object
      properties:
        description:
          type: string
          minLength: 3
          maxLength: 300
      required:
        - description

    UpdateTaskRequest:
      type: object
      properties:
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED]
        cost:
          type: number
          minimum: 0
        costNotes:
          type: string
          maxLength: 500
      required:
        - status

    UpdateTaskResponse:
      type: object
      properties:
        task:
          $ref: '#/components/schemas/WorkOrderTask'
        workOrder:
          type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [EN_PROCESO, LISTA_PARA_ENTREGA, OWNER_CONTACTED, ENTREGADA]
            totalAmount:
              type: number
            updatedAt:
              type: string
              format: date-time
          required:
            - id
            - status
            - totalAmount
            - updatedAt
      required:
        - task
        - workOrder

    WorkOrderDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        ownerClientId:
          type: string
          format: uuid
        status:
          type: string
          enum: [EN_PROCESO, LISTA_PARA_ENTREGA, OWNER_CONTACTED, ENTREGADA]
        entryReason:
          type: string
        mileage:
          type: integer
        assignedMechanicId:
          type: string
          format: uuid
          nullable: true
        checkedInAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdById:
          type: string
          format: uuid
        totalAmount:
          type: number
        visitDiagnosis:
          type: string
          nullable: true
        visitRepairSummary:
          type: string
          nullable: true
        visitPartsUsed:
          type: string
          nullable: true
        visitAdditionalNotes:
          type: string
          nullable: true
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderTask'
        vehicle:
          $ref: '#/components/schemas/WorkOrderVehicleSummary'
        owner:
          $ref: '#/components/schemas/WorkOrderOwnerSummary'
      required:
        - id
        - vehicleId
        - ownerClientId
        - status
        - entryReason
        - mileage
        - checkedInAt
        - updatedAt
        - createdById
        - totalAmount
        - tasks
        - vehicle
        - owner

    WorkOrderTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED]
        cost:
          type: number
          nullable: true
        costNotes:
          type: string
          nullable: true
        diagnosis:
          type: string
          nullable: true
        repairPerformed:
          type: string
          nullable: true
        partsUsed:
          type: string
          nullable: true
        additionalNotes:
          type: string
          nullable: true
        sortOrder:
          type: integer
        completedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - description
        - status
        - sortOrder

    WorkOrderVehicleSummary:
      type: object
      properties:
        licensePlate:
          type: string
        brand:
          type: string
        model:
          type: string
      required:
        - licensePlate
        - brand
        - model

    WorkOrderOwnerSummary:
      type: object
      properties:
        fullName:
          type: string
        nationalId:
          type: string
      required:
        - fullName
        - nationalId

    ActiveWorkOrderConflict:
      type: object
      properties:
        statusCode:
          type: integer
          example: 409
        message:
          type: string
          example: Vehicle already has an active work order
        error:
          type: string
          example: Conflict
        activeWorkOrderId:
          type: string
          format: uuid
      required:
        - statusCode
        - message
        - error
        - activeWorkOrderId

    UpdateTaskTechnicalNotesRequest:
      type: object
      properties:
        diagnosis:
          type: string
          maxLength: 5000
          nullable: true
        repairPerformed:
          type: string
          maxLength: 5000
          nullable: true
        partsUsed:
          type: string
          maxLength: 5000
          nullable: true
        additionalNotes:
          type: string
          maxLength: 5000
          nullable: true

    TaskTechnicalNotesResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED]
        diagnosis:
          type: string
          nullable: true
        repairPerformed:
          type: string
          nullable: true
        partsUsed:
          type: string
          nullable: true
        additionalNotes:
          type: string
          nullable: true
      required:
        - id
        - description
        - status

    UpdateVisitNotesRequest:
      type: object
      properties:
        visitDiagnosis:
          type: string
          maxLength: 5000
          nullable: true
        visitRepairSummary:
          type: string
          maxLength: 5000
          nullable: true
        visitPartsUsed:
          type: string
          maxLength: 5000
          nullable: true
        visitAdditionalNotes:
          type: string
          maxLength: 5000
          nullable: true

    VisitNotesResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [EN_PROCESO, LISTA_PARA_ENTREGA, OWNER_CONTACTED, ENTREGADA]
        visitDiagnosis:
          type: string
          nullable: true
        visitRepairSummary:
          type: string
          nullable: true
        visitPartsUsed:
          type: string
          nullable: true
        visitAdditionalNotes:
          type: string
          nullable: true
      required:
        - id
        - status

tags:
  - name: Work Orders
    description: Work order creation, task management, technical notes, and lookup (US-005, US-006, US-007)
