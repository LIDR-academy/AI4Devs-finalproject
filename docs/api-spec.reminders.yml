openapi: 3.0.0
info:
  title: MecaTrack API — Maintenance Reminders
  description: ADMIN-only preventive maintenance reminder panel (US-D4)
  version: 1.0.0

servers:
  - url: http://localhost:4000/api
    description: Local development

paths:
  /reminders/eligible:
    get:
      summary: List vehicles eligible for maintenance reminders
      description: |
        Vehicles with last ENTREGADA delivery older than threshold days (default 180),
        no active work order, not opted out, with active ownership.
        Supports pagination for dashboard (`limit=5`) and full panel.
      tags: [Reminders]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: days
          schema:
            type: integer
            minimum: 30
            maximum: 730
        - in: query
          name: q
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Paginated eligible list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibleRemindersResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (non-ADMIN)

  /reminders/opted-out:
    get:
      summary: List vehicles opted out of reminders
      tags: [Reminders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Opted-out list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptedOutRemindersResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /reminders/send:
    post:
      summary: Batch-send maintenance reminder emails
      description: |
        Re-validates eligibility per vehicle. Partial success returns HTTP 200 with per-item statuses.
        Only `sent` updates `lastReminderSentAt`.
      tags: [Reminders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleIds]
              properties:
                vehicleIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Batch results with summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendRemindersResponse'
        '400':
          description: Invalid body
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /reminders/{vehicleId}/opt-out:
    post:
      summary: Exclude vehicle from reminders
      tags: [Reminders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: vehicleId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Opt-out applied (idempotent)
        '404':
          description: Vehicle not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /reminders/{vehicleId}/opt-in:
    post:
      summary: Clear reminder opt-out
      tags: [Reminders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: vehicleId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Opt-in applied
        '404':
          description: Vehicle not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    EligibleReminderItem:
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
        licensePlate:
          type: string
        vehicleLabel:
          type: string
        ownerName:
          type: string
        ownerEmail:
          type: string
          nullable: true
        ownerClientId:
          type: string
          format: uuid
        lastVisitAt:
          type: string
          format: date-time
        daysSinceVisit:
          type: integer
        lastReminderSentAt:
          type: string
          format: date-time
          nullable: true
        canEmail:
          type: boolean

    EligibleRemindersResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EligibleReminderItem'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        thresholdDays:
          type: integer

    OptedOutRemindersResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              vehicleId:
                type: string
              licensePlate:
                type: string
              vehicleLabel:
                type: string
              ownerName:
                type: string
                nullable: true
              excludedAt:
                type: string
                format: date-time
                nullable: true
              excludedBy:
                type: object
                nullable: true
                properties:
                  id:
                    type: string
                  fullName:
                    type: string
        total:
          type: integer

    SendRemindersResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              vehicleId:
                type: string
              licensePlate:
                type: string
              emailStatus:
                type: string
                enum:
                  - sent
                  - skipped_no_email
                  - skipped_disabled
                  - skipped_not_eligible
                  - failed
              warning:
                type: string
                nullable: true
        summary:
          type: object
          properties:
            requested:
              type: integer
            sent:
              type: integer
            skipped:
              type: integer
            failed:
              type: integer
