# "pagina_openverse": permalink de Openverse donde se verificó la licencia y el crédito de atribución exacto.
# Nota: se priorizó variedad y relevancia real de la foto sobre resolución estricta ≥1000px, y no se
# filtró por tipo de licencia, conforme a lo acordado (proyecto educativo/personal).

