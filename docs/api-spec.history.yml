openapi: 3.0.0
info:
  title: MecaTrack API — History
  description: Read-only vehicle visit timeline and client profile (US-009)
  version: 1.0.0

servers:
  - url: http://localhost:4000/api
    description: Local development

paths:
  /vehicles/{vehicleId}/history:
    get:
      summary: Get full vehicle visit history
      tags: [History]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: vehicleId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Vehicle history timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleHistoryResponse'
        '401':
          description: Unauthorized
        '404':
          description: Vehicle not found

  /clients/{clientId}:
    get:
      summary: Get client profile with active vehicles
      tags: [History]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Client profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientProfileResponse'
        '401':
          description: Unauthorized
        '404':
          description: Client not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    VehicleHistoryResponse:
      type: object
      required:
        - vehicleId
        - licensePlate
        - vehicleLabel
        - currentOwner
        - visits
        - total
      properties:
        vehicleId:
          type: string
          format: uuid
        licensePlate:
          type: string
        vehicleLabel:
          type: string
        currentOwner:
          nullable: true
          type: object
          description: Null when the vehicle has no active ownership (US-D9).
          properties:
            id:
              type: string
              format: uuid
            fullName:
              type: string
            nationalId:
              type: string
        visits:
          type: array
          items:
            $ref: '#/components/schemas/VehicleHistoryVisit'
        total:
          type: integer

    VehicleHistoryVisit:
      type: object
      required:
        - workOrderId
        - checkedInAt
        - status
        - statusLabel
        - entryReason
        - mileage
        - totalAmount
        - ownerAtVisit
        - broughtByName
        - broughtByPhone
        - visitNotes
        - tasks
      properties:
        workOrderId:
          type: string
          format: uuid
        checkedInAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        statusLabel:
          type: string
        entryReason:
          type: string
        mileage:
          type: integer
          nullable: true
        totalAmount:
          type: number
        ownerAtVisit:
          nullable: true
          type: object
          description: Null for THIRD_PARTY visits without linked owner (US-D9).
          properties:
            id:
              type: string
              format: uuid
            fullName:
              type: string
            nationalId:
              type: string
        broughtByName:
          type: string
          nullable: true
        broughtByPhone:
          type: string
          nullable: true
        visitNotes:
          type: object
        tasks:
          type: array
          items:
            type: object

    ClientProfileResponse:
      type: object
      required:
        - id
        - fullName
        - nationalId
        - phone
        - email
        - createdAt
        - vehicles
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        nationalId:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/ClientVehicleSummary'

    ClientVehicleSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        licensePlate:
          type: string
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        lastVisitAt:
          type: string
          format: date-time
          nullable: true
        lastVisitStatus:
          type: string
          nullable: true

tags:
  - name: History
    description: Read-only history (US-009)
