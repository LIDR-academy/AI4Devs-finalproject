services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-bpb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ai_bpb
    ports:
      - "5432:5432"
    volumes:
      - ai-bpb-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai_bpb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai-bpb-postgres-data:
