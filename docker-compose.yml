services:
  postgres:
    image: postgres:16-alpine
    container_name: realista-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: realista
      POSTGRES_PASSWORD: realista
      POSTGRES_DB: realista
    ports:
      - '5433:5432'
    volumes:
      - realista-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U realista -d realista']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: realista-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  realista-pg-data:
    name: realista-pg-data
