# Production stack (US-011 hardened). Secrets come from host .env (not committed).
# Do not add a custom Compose `name:` here — existing volume is
# ai4devs-finalproject_mecatrack_pg_data.

services:
  postgres:
    image: postgres:16-alpine
    container_name: mecatrack-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5434:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - mecatrack_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: mecatrack-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: 'false'
      ENABLE_ADMIN_BOOTSTRAP: ${ENABLE_ADMIN_BOOTSTRAP:-false}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:4000/api/health/ready'').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: mecatrack-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: http://api:4000
      NEXT_PUBLIC_API_URL: /api
    ports:
      - '0.0.0.0:${WEB_PORT:-3000}:3000'

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mecatrack-prometheus
    profiles: ['observability']
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/rules:/etc/prometheus/rules:ro
      - mecatrack_prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    container_name: mecatrack-grafana
    profiles: ['observability']
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://127.0.0.1:3001
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - mecatrack_grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - prometheus

volumes:
  mecatrack_pg_data:
  mecatrack_prometheus_data:
  mecatrack_grafana_data:
