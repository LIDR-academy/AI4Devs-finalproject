services:
  postgres:
    image: postgres:17-alpine
    container_name: travelsplit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-travelsplit}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: travelsplit-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: development
      API_PREFIX: api
      CORS_ORIGINS: http://localhost:5173
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-travelsplit}
      DB_LOGGING: 'false'
      DB_SYNCHRONIZE: 'false'
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 3600
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./Backend/src:/app/src

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: travelsplit-frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api
    volumes:
      - ./Frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data:
