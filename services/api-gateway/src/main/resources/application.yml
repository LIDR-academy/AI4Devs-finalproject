spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${MTL_JWT_ISSUER_URI:http://localhost:8180/realms/mtl}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/api/**]":
                allowedOrigins:
                  - http://localhost:5173
                  - http://127.0.0.1:5173
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept
                  - X-Correlation-Id
                allowCredentials: false
          routes:
            - id: catalog-service
              uri: ${mtl.catalog.uri:http://localhost:8081}
              predicates:
                - Path=/api/catalog/**
            - id: media-service
              uri: ${mtl.media.uri:http://localhost:8082}
              predicates:
                - Path=/api/media/**
            - id: notification-service
              uri: ${mtl.notification.uri:http://localhost:8083}
              predicates:
                - Path=/api/notifications/**
            - id: ai-assistant-service
              uri: ${mtl.ai.uri:http://localhost:8084}
              predicates:
                - Path=/api/ai/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
