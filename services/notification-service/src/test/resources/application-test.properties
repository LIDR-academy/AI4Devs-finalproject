spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/mtl
spring.datasource.url=jdbc:h2:mem:notification;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS notification
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=notification
# Persistencia/constraints PostgreSQL: tests *IT* con perfil test-pg + Testcontainers (Flyway).
spring.flyway.enabled=false

mtl.notification.kafka.enabled=false
mtl.notification.kafka.ejemplar-evento-topic=catalog.ejemplar.evento

# Sin spring.mail.host: no se crea JavaMailSender en tests (los envíos se prueban con mock).
mtl.notification.mail.enabled=false
mtl.notification.mail.from=MyTreeLibrary <noreply@example.invalid>

management.endpoints.web.exposure.include=health,info
