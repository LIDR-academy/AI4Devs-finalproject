spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=notification
spring.datasource.hikari.connection-init-sql=SET search_path TO notification, public
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true
spring.flyway.schemas=notification
spring.flyway.default-schema=notification
spring.flyway.validate-on-migrate=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/mtl

mtl.notification.kafka.enabled=true
mtl.notification.kafka.arbol-evento-topic=catalog.arbol.evento
mtl.notification.kafka.consumer-group-id=notification-it-placeholder
spring.kafka.bootstrap-servers=${test.kafka.bootstrap-servers:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest

# Sin SMTP real en IT: el remitente omite envío y marca ENVIADA sin conectar.
mtl.notification.mail.enabled=false
mtl.notification.mail.from=MyTreeLibrary <noreply@example.invalid>

logging.level.org.apache.kafka=WARN
logging.level.org.hibernate.SQL=WARN
