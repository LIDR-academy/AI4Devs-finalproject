# Perfil prod (SPRING_PROFILES_ACTIVE=prod). URLs y credenciales solo por entorno; sin defaults de localhost.

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MTL_JWT_ISSUER_URI}

spring.datasource.url=${MTL_DATASOURCE_URL}
spring.datasource.username=${MTL_DATASOURCE_USERNAME}
spring.datasource.password=${MTL_DATASOURCE_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=notification

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=false
spring.flyway.schemas=notification
spring.flyway.default-schema=notification
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

mtl.notification.kafka.enabled=${MTL_NOTIFICATION_KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${MTL_KAFKA_BOOTSTRAP_SERVERS:}

spring.mail.host=${MTL_NOTIFICATION_MAIL_HOST:}
spring.mail.port=${MTL_NOTIFICATION_MAIL_PORT:587}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MTL_NOTIFICATION_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MTL_NOTIFICATION_MAIL_SMTP_STARTTLS:true}

mtl.notification.mail.enabled=${MTL_NOTIFICATION_MAIL_ENABLED:true}
mtl.notification.mail.from=${MTL_NOTIFICATION_MAIL_FROM:}
