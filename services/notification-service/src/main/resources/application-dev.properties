spring.security.oauth2.resourceserver.jwt.issuer-uri=${MTL_JWT_ISSUER_URI:http://localhost:8180/realms/mtl}

spring.datasource.url=jdbc:postgresql://localhost:5433/mtl
spring.datasource.username=mtl
spring.datasource.password=mtl_dev_password
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=notification
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true
spring.flyway.schemas=notification
spring.flyway.default-schema=notification
spring.flyway.validate-on-migrate=true
logging.level.org.flywaydb=INFO

# Kafka (Compose): mismo criterio que catalog-service (infra/compose README).
mtl.notification.kafka.enabled=true
spring.kafka.bootstrap-servers=${MTL_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.auto-offset-reset=earliest

# SMTP (Mailpit en Compose: puertos en infra/compose/README.md). JavaMailSender usa spring.mail.*.
spring.mail.host=${MTL_NOTIFICATION_MAIL_HOST:localhost}
spring.mail.port=${MTL_NOTIFICATION_MAIL_PORT:1025}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

mtl.notification.mail.enabled=true
mtl.notification.mail.from=${MTL_NOTIFICATION_MAIL_FROM:MyTreeLibrary <notificaciones@localhost>}
