spring.application.name=notification-service
server.port=8083

# Kafka (HU-007): listener solo si enabled=true (p. ej. application-dev).
mtl.notification.kafka.enabled=false
mtl.notification.kafka.ejemplar-evento-topic=catalog.ejemplar.evento
mtl.notification.kafka.consumer-group-id=notification-service

# Correo: sin spring.mail.host no se auto-configura JavaMailSender (Boot). Perfil dev: Mailpit (infra/compose).
mtl.notification.mail.enabled=false
mtl.notification.mail.from=MyTreeLibrary <noreply@localhost>

spring.mvc.problemdetails.enabled=true

# Observabilidad (ADR-0005): Actuator, Prometheus, logs JSON.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENV:local}
logging.structured.format.console=logstash
