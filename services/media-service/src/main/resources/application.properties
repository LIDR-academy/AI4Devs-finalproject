spring.application.name=media-service
server.port=8082

# Correlación con el gateway (MDC `correlationId`); ver CorrelationIdFilter y logging.mdc.

# Reglas de subida HU-006 (TASK-HU-006-02)
mtl.media.upload.max-file-size=20MB
mtl.media.upload.max-photos-per-ejemplar=10
mtl.media.upload.allowed-mime-types=image/jpeg,image/png,image/webp
mtl.media.storage.bucket=mtl-photos
mtl.media.storage.endpoint=http://localhost:9000
# access-key / secret-key: perfil dev (local) o variables MINIO_ROOT_*; tests: application-test.properties
mtl.media.presign.expires-in=PT15M

# Catálogo (permiso de subida de fotos por ejemplar; TASK-HU-006-05).
mtl.catalog.base-url=http://localhost:8081

# RFC 9457 para respuestas de error.
spring.mvc.problemdetails.enabled=true

# Observabilidad (ADR-0005): Actuator, Prometheus, logs JSON.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENV:local}
logging.structured.format.console=logstash
