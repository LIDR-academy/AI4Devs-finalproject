spring.application.name=media-service
server.port=8082

# Reglas de subida HU-006 (TASK-HU-006-02)
mtl.media.upload.max-file-size=20MB
mtl.media.upload.max-photos-per-tree=10
mtl.media.upload.allowed-mime-types=image/jpeg,image/png,image/webp
mtl.media.storage.bucket=mtl-photos
mtl.media.storage.endpoint=http://localhost:9000
# Deben coincidir con MinIO local (infra/compose): credenciales de arranque del contenedor.
mtl.media.storage.access-key=${MINIO_ROOT_USER:minio}
mtl.media.storage.secret-key=${MINIO_ROOT_PASSWORD:minio_dev_password}
mtl.media.presign.expires-in=PT15M

# Catálogo (permiso de subida de fotos por árbol; TASK-HU-006-05).
mtl.catalog.base-url=http://localhost:8081

# RFC 9457 para respuestas de error.
spring.mvc.problemdetails.enabled=true
