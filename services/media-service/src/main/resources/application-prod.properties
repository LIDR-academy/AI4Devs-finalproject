# Perfil prod (SPRING_PROFILES_ACTIVE=prod). URLs y credenciales solo por entorno; sin defaults de localhost.

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MTL_JWT_ISSUER_URI}

mtl.catalog.base-url=${MTL_CATALOG_BASE_URL:}

mtl.media.storage.access-key=${MINIO_ROOT_USER:}
mtl.media.storage.secret-key=${MINIO_ROOT_PASSWORD:}
mtl.media.storage.endpoint=${MTL_MEDIA_STORAGE_ENDPOINT:}

spring.datasource.url=${MTL_DATASOURCE_URL}
spring.datasource.username=${MTL_DATASOURCE_USERNAME}
spring.datasource.password=${MTL_DATASOURCE_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=media

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=false
spring.flyway.schemas=media
spring.flyway.default-schema=media
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
