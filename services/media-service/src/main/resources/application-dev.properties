spring.security.oauth2.resourceserver.jwt.issuer-uri=${MTL_JWT_ISSUER_URI:http://localhost:8180/realms/mtl}
mtl.catalog.base-url=${MTL_CATALOG_BASE_URL:http://localhost:8081}

# MinIO (infra/compose/.env.example): deben coincidir con MINIO_ROOT_USER / MINIO_ROOT_PASSWORD del contenedor.
mtl.media.storage.access-key=${MINIO_ROOT_USER:minio}
mtl.media.storage.secret-key=${MINIO_ROOT_PASSWORD:minio_dev_password}

spring.datasource.url=jdbc:postgresql://localhost:5433/mtl
spring.datasource.username=mtl
spring.datasource.password=mtl_dev_password
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=media
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true
spring.flyway.schemas=media
spring.flyway.default-schema=media
spring.flyway.validate-on-migrate=true
logging.level.org.flywaydb=INFO
