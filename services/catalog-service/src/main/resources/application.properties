spring.application.name=catalog-service
server.port=8081

# Kafka (eventos de árbol): desactivado por defecto; perfil dev lo activa (ver application-dev.properties).
mtl.catalog.kafka.enabled=false
mtl.catalog.kafka.arbol-evento-topic=catalog.arbol.evento

# Cliente HTTP hacia media-service (borrado masivo de fotos, HU-008).
mtl.media.base-url=http://localhost:8082

# Caché desactivada por defecto (no-op). El perfil dev la conmuta a Redis.
spring.cache.type=none

# RFC 9457: ProblemDetail en controladores y cabeceras coherentes con el contrato API.
spring.mvc.problemdetails.enabled=true
# Observabilidad (ADR-0005): Actuator, Prometheus, logs JSON. Correlación vía MDC en logs estructurados.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENV:local}
logging.structured.format.console=logstash
