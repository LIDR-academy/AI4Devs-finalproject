spring.application.name=catalog-service
server.port=8081

# Kafka (eventos de árbol): desactivado por defecto; perfil dev lo activa (ver application-dev.properties).
mtl.catalog.kafka.enabled=false
mtl.catalog.kafka.arbol-evento-topic=catalog.arbol.evento

# RFC 9457: ProblemDetail en controladores y cabeceras coherentes con el contrato API.
spring.mvc.problemdetails.enabled=true
# Superficie operativa mínima alineada con seguridad: solo endpoints de salud e info.
management.endpoints.web.exposure.include=health,info

# Correlación con el gateway (MDC `correlationId`); ver CorrelationIdFilter y logging.mdc.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [correlationId=%X{correlationId:-}] - %msg%n
