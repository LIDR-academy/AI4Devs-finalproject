# Perfil prod (SPRING_PROFILES_ACTIVE=prod). URLs y credenciales solo por entorno; sin defaults de localhost.

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MTL_JWT_ISSUER_URI}

spring.datasource.url=${MTL_DATASOURCE_URL}
spring.datasource.username=${MTL_DATASOURCE_USERNAME}
spring.datasource.password=${MTL_DATASOURCE_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET search_path TO catalog, public

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=catalog

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=false
spring.flyway.schemas=catalog
spring.flyway.default-schema=catalog
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

mtl.catalog.kafka.enabled=${MTL_CATALOG_KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${MTL_KAFKA_BOOTSTRAP_SERVERS:}
mtl.media.base-url=${MTL_MEDIA_BASE_URL:}

spring.cache.type=${MTL_CACHE_TYPE:redis}
spring.data.redis.host=${MTL_REDIS_HOST:}
spring.data.redis.port=${MTL_REDIS_PORT:6379}
