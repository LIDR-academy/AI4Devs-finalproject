# Alineado con infra/compose/.env.example (PostgreSQL en localhost tras docker compose up).
# El puerto del host debe coincidir con POSTGRES_PORT en infra/compose/.env (por defecto 5433).
# Keycloak realm (mismo issuer que el gateway; desde Docker interno puede ser http://keycloak:8080/realms/mtl).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${MTL_JWT_ISSUER_URI:http://localhost:8180/realms/mtl}

# Kafka (Compose): cliente en el host → localhost:9094 (infra/compose/.env.example, KAFKA_PORT_HOST).
mtl.catalog.kafka.enabled=true
spring.kafka.bootstrap-servers=${MTL_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# Caché Redis (Compose): cliente en el host → localhost:${REDIS_PORT:-6379}. Ver CatalogCacheConfig.
spring.cache.type=redis
spring.data.redis.host=${MTL_REDIS_HOST:localhost}
spring.data.redis.port=${MTL_REDIS_PORT:6379}

spring.datasource.url=jdbc:postgresql://localhost:5433/mtl
spring.datasource.username=mtl
spring.datasource.password=mtl_dev_password
# La extensión unaccent queda en public (init Compose + Flyway V3); el modelo JPA usa esquema catalog.
# Sin public en search_path, PostgreSQL no resuelve unaccent(...) en las @Query nativas.
spring.datasource.hikari.connection-init-sql=SET search_path TO catalog, public
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=catalog
# Spring Boot 4: usar spring-boot-starter-flyway (no solo flyway-core) para que las migraciones se ejecuten al arrancar.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true
spring.flyway.schemas=catalog
spring.flyway.default-schema=catalog
spring.flyway.validate-on-migrate=true
logging.level.org.flywaydb=INFO
