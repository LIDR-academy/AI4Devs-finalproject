spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=catalog
spring.datasource.hikari.connection-init-sql=SET search_path TO catalog, public
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true
spring.flyway.schemas=catalog
spring.flyway.default-schema=catalog
spring.flyway.validate-on-migrate=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/mtl

mtl.catalog.kafka.enabled=true
mtl.catalog.kafka.arbol-evento-topic=catalog.arbol.evento
spring.kafka.bootstrap-servers=${test.kafka.bootstrap-servers:localhost:9092}
spring.kafka.consumer.group-id=catalog-it-consumer
