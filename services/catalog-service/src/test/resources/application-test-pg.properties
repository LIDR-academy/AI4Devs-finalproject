spring.main.web-application-type=none
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=catalog
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true
spring.flyway.schemas=catalog
spring.flyway.default-schema=catalog
spring.flyway.validate-on-migrate=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/mtl
