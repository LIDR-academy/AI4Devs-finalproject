spring.jpa.open-in-view=false

# Tests sin broker Kafka: publicador no-op (no se llama a nextval ni a Kafka).
mtl.catalog.kafka.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/mtl
spring.datasource.url=jdbc:h2:mem:catalog;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=catalog
spring.flyway.enabled=false
