# Perfil prod (SPRING_PROFILES_ACTIVE=prod). URLs y credenciales solo por entorno; sin defaults de localhost.

spring.datasource.url=${MTL_DATASOURCE_URL}
spring.datasource.username=${MTL_DATASOURCE_USERNAME}
spring.datasource.password=${MTL_DATASOURCE_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=ai

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=false
spring.flyway.schemas=ai
spring.flyway.default-schema=ai
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
