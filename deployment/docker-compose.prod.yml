# docker-compose.prod.yml
# Production stack — pre-built images, health checks, resource limits, restart policies
# Usage: docker compose -f deployment/docker-compose.prod.yml up -d
#
# Requires: deployment/.env  (copy from deployment/.env.example, fill in ALL secrets)

name: ipfs-gateway-prod

services:

  # --------------------------------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ipfs_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Redis
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - ipfs_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Backend (Gunicorn / Flask production)
  # --------------------------------------------------------------------------
  backend:
    image: ${PRIVATE_DOCKER_REPOSITORY}:ipfs-gateway-prod-backend-latest
    pull_policy: always
    restart: always
    env_file:
      - .env
    environment:
      APP_SETTINGS_MODULE: config.production.ProductionConfig
      APP_DEBUG:           "false"
      DATABASE_URL:        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:           redis://redis:6379/0
      CELERY_BROKER_URL:   redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
    volumes:
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ipfs_net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # Celery worker
  # --------------------------------------------------------------------------
  celery:
    image: ${PRIVATE_DOCKER_REPOSITORY}:ipfs-gateway-prod-celery-latest
    pull_policy: always
    restart: always
    env_file:
      - .env
    environment:
      APP_SETTINGS_MODULE: config.production.ProductionConfig
      DATABASE_URL:        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:           redis://redis:6379/0
      CELERY_BROKER_URL:   redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ipfs_net
    healthcheck:
      test: ["CMD-SHELL",
             "celery -A celery_worker.celery inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    command: >
      celery -A celery_worker.celery worker
        --loglevel=info
        --concurrency=4
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # Frontend (Next.js standalone)
  # --------------------------------------------------------------------------
  frontend:
    image: ${PRIVATE_DOCKER_REPOSITORY}:ipfs-gateway-prod-frontend-latest
    pull_policy: always
    restart: always
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL:  ""
      BACKEND_API_URL:      http://backend:5000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ipfs_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Nginx
  # --------------------------------------------------------------------------
  nginx:
    image: ${PRIVATE_DOCKER_REPOSITORY}:ipfs-gateway-prod-nginx-latest
    pull_policy: always
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - ipfs_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# --------------------------------------------------------------------------
# Named volumes
# --------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  backend_logs:

# --------------------------------------------------------------------------
# Network
# --------------------------------------------------------------------------
networks:
  ipfs_net:
    driver: bridge
