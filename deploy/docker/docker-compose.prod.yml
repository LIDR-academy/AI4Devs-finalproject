name: tejaflow-prod

services:
  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tejaflow_network

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TejaFlowDb: ${TEJAFLOW_CONNECTION_STRING}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN}
      TejaFlow__RunMigrationsOnStartup: ${TEJAFLOW_RUN_MIGRATIONS}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/8080'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - tejaflow_network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - tejaflow_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 25s
    networks:
      - tejaflow_network

networks:
  tejaflow_network:
    name: tejaflow_network

volumes:
  tejaflow_sqlserver_data:
