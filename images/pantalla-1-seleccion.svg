  <line x1="200" y1="370" x2="520" y2="370" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4"/>
  <text x="360" y="395" text-anchor="middle" font-size="12" fill="#4dabf7">+ Indexar mi propio repositorio</text>
