  <text x="517" y="306" text-anchor="middle" font-size="10" fill="#1971c2" font-weight="600">listo</text>

  <rect x="414" y="322" width="236" height="18" fill="#74c0fc" rx="4"/>
  <text x="532" y="335" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Explorar proyecto →</text>

