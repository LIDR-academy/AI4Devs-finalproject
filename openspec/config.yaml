schema: spec-driven

# Project context — shown to AI when creating artifacts (proposals, specs, tasks).
context: |
  PROJECT: QuickChat — a live streaming + chat platform.
  Users are Publishers (create/manage rooms and streams) and Subscribers (watch and chat).

  TEAM & SCOPES (each teammate owns exactly one dev/<name>/ folder; nobody edits another scope):
  - qc-portal  — Frontend portal: Login, Streamings, Rooms. Stack: TypeScript, Vite, VanJS, Bun.
  - security   — Auth + token authority: magic-link login (User), JWT/room tokens (Tokens). Stack: Go.
  - streamer   — Real-time core: Stream, Rooms, Chats, Auth. Stack: Go.
  - users      — User persistence; single source of truth for a user. Stack: Go + MongoDB.
  - devops     — Compose/runtime wiring all services + infra. READ-ONLY on all service code.

  EXTERNAL SYSTEMS: SuperTokens (security), MongoDB (users), Valkey (streamer state/pub-sub),
  LiveKit SFU (portal + streamer media, WebRTC).

  INTEGRATION SEAMS (cross-scope wire contracts — agreed up front, never changed unilaterally):
  - qc-portal -> security: magic-link request/verify (JSON/HTTP); session/token returned to portal.
  - qc-portal -> streamer: streams list/manage + rooms (JSON/HTTP); chat (WebSocket frames).
  - qc-portal -> LiveKit: room media (WebRTC).
  - streamer -> security: fetch room token (JSON/HTTP); claims, TTL, signing/verification.
  - security -> users: create-user command on first auth; MUST be idempotent (retries never duplicate).
  - OPEN: who issues the LiveKit access token (security vs streamer) — resolve in a feature's contract phase.

  GOVERNANCE:
  - The code constitution (code-constitution/CONSTITUTION.md + .go.md + .ts.md) is law.
  - Openspec is the single source of truth for orchestration and history; the team lead coordinates.
  - Every teammate runs its own openspec workflow: proposal -> spec -> tasks -> implementation.
    Jumping straight to code is forbidden.

  ENGINEERING BASELINE (from the constitution):
  - Boring, obvious code; no speculative abstractions; touch only files related to the task.
  - Tests are non-negotiable and ship with every change (happy + error paths). Never skip/disable a test.
  - Config comes from the environment. No secrets/tokens/credentials or PII in code, fixtures, or logs.
  - Validate all external input (HTTP payloads, WS frames, env vars) at the boundary.
  - Each service owns its own Dockerfile; devops only consumes them.
  - Go: gofmt + go vet + golangci-lint + `go test -race ./...` clean; go.mod tidy; every goroutine has a
    stop path; context.Context on every I/O path, never stored in a struct.
  - TS: strict mode, no `any`; Bun is the toolchain; `tsc --noEmit` + `bun test` + formatter/linter clean.

# Per-artifact rules applied when teammates generate openspec artifacts.
rules:
  proposal:
    - State which teammate scope(s) the change touches; flag every cross-scope wire contract explicitly.
    - Include a "Non-goals" section.
    - Resolve cross-scope contracts before delegation, not during implementation.
  spec:
    - Specify behavior, not implementation; cover error paths, not just the happy path.
    - Define and validate every external input (HTTP payload, WebSocket frame, env var) at the boundary.
  tasks:
    - Every task belongs to exactly one teammate scope.
    - Each unit of work ships with its tests; no task is "done" without them.
    - Definition of Done requires evidence: root cause (for bugs) -> change -> test that proves it ->
      full-suite result. Never a bare "done".
