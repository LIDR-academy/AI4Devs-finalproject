services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aenea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aenea}
      POSTGRES_DB: ${POSTGRES_DB:-aenea}
    ports:
      - "5432:5432"
    volumes:
      - aenea_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aenea}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  aenea_db_data:
