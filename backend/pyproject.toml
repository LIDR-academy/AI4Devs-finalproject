[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipfs-gateway-backend"
version = "0.1.0"
description = "Backend service for the IPFS Gateway SaaS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0,<4.0.0",
    "flask-cors>=4.0.0,<5.0.0",
    "gunicorn>=21.0.0,<23.0.0",
    "werkzeug>=3.0.0,<4.0.0",
    "sqlmodel>=0.0.16,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "celery>=5.3.0,<6.0.0",
    "redis>=5.0.0,<6.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "boto3>=1.34.0,<2.0.0",
    "pybreaker>=1.0.0,<2.0.0",
    "tenacity>=8.2.0,<9.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "httpx>=0.26.0,<1.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt>=4.0.1,<4.1.0",
    "email-validator>=2.1.0,<3.0.0",
    "flasgger>=0.9.7,<1.0.0",
    "flask-limiter>=3.5.0,<4.0.0",
    "python-multipart>=0.0.6,<1.0.0",
    "arrow>=1.3.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "coverage>=7.3.0,<8.0.0",
    "faker>=22.0.0,<23.0.0",
    "vcrpy>=5.1.0,<6.0.0",
    "pytest-vcr>=1.0.2,<2.0.0",
    "black>=23.12.0,<24.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=7.0.0,<8.0.0",
    "mypy>=1.8.0,<2.0.0",
    "pre-commit>=3.6.0,<4.0.0",
    "bandit>=1.7.0,<2.0.0",
    "factory-boy>=3.3.0,<4.0.0",
]

[tool.setuptools]
packages = ["core", "config", "server"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
